name: Daily security scan

# Triggers the backend's site sync (pull /wp-json/vynox/v1/data for every
# site, store a Snapshot, update Site.latest health status, sync the
# persisted Alert collection, and send email notifications for newly-offline
# sites / new high-severity alerts — see services/scanAllSites.js).
#
# This replaces the old manual per-site "Sync" button on the frontend. Since
# the vynox-api backend runs on shared cPanel hosting (no cron/SSH access for
# scheduled jobs), we trigger it the same way screenshots.yml already
# triggers screenshot captures: a scheduled GitHub Actions run hitting a
# protected HTTP endpoint. This job is much simpler though — no Node/
# Playwright setup, just a single curl call.
#
# Runs every hour, on the ":10" minute (UTC). This is just a lightweight
# pull of each site's own /data endpoint (WordPress health/uptime/updates/
# malware info our own plugin already exposes) — it doesn't touch any
# external quota-limited API (unlike PageSpeed, which stays on its own
# twice-daily schedule in pagespeed-desktop.yml because Google's PageSpeed
# API is a shared, rate-limited resource). Running this hourly instead of
# 2x/day just means Site.status/health and the Alerts list stay fresher,
# with no real cost — routes/scan.js's `running` flag only guards against
# two runs overlapping, there's no cooldown/quota gate to raise here.
#
# NOTE: deliberately NOT on the round hour (":00"). GitHub Actions doesn't
# guarantee scheduled runs fire at the exact minute — round hours like
# 00:00/12:00 UTC get hit by a huge number of repos at once, so GitHub's
# shared runners can queue jobs for hours (observed live: a 07:00 UTC run
# still hadn't started ~3 hours later). Offsetting to an odd minute
# (":10" here) keeps the actual delay much closer to GitHub's normal
# few-minutes lag.
#
# ALSO NOTE: vynox.progamesgears.com (this backend itself) lives on the same
# hosting account where Imunify360 blocked the OTP-check monitor as "bot
# traffic" (see otp-check.yml / services/otpCheck.js). The same thing can
# happen to THIS request too, since it's also a plain server-to-server POST
# with no browser fingerprint. We send the same X-Vynox-Bot header (reusing
# the already-issued OTP_MONITOR_SECRET) so hosting support can allowlist it
# the same way, without needing a second secret/rule.
on:
  schedule:
    - cron: '10 * * * *'  # every hour at :10 past the hour (UTC)
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    # 2026-08-19: routes/scan.js's /run-all now responds 202 immediately and
    # runs scanAllSites() in the background (same fire-and-forget pattern as
    # /run-pagespeed) — it used to await the full loop before responding,
    # which regularly exceeded cPanel's ~2min LiteSpeed proxy timeout once
    # there were enough sites (or one slow one), failing this workflow with
    # a 500 even though the scan itself finished fine server-side. This job
    # now just confirms the run STARTED, so 15 min of headroom is far more
    # than the single HTTP call needs — kept generous in case the backend
    # itself is briefly slow to respond (cold start, etc.).
    timeout-minutes: 15
    steps:
      - name: Trigger daily scan
        env:
          OTP_MONITOR_SECRET: ${{ secrets.OTP_MONITOR_SECRET }}
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "https://vynox.progamesgears.com/api/scan/run-all" \
            -H "X-Scan-Secret: ${{ secrets.SCAN_TRIGGER_SECRET }}" \
            -H "Content-Type: application/json" \
            ${OTP_MONITOR_SECRET:+-H "X-Vynox-Bot: $OTP_MONITOR_SECRET"} \
            -d "{}")
          echo "Response body:"
          cat /tmp/response.txt
          echo ""
          echo "HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Scan trigger failed with status $status"
            exit 1
          fi
