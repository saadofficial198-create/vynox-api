name: OTP email delivery check

# Verifies BoloCart's WooCommerce Email OTP Verification flow actually works
# end-to-end: plugin active (Layer 1) -> WP Mail SMTP configured (Layer 2) ->
# checkout triggers the OTP popup and the email actually lands in the inbox
# (Layer 3, via Playwright + IMAP). See services/otpCheck.js,
# services/otpLayers.js, services/imapCheck.js, scripts/runOtpCheck.js.
#
# Runs on GitHub's free Ubuntu runners (same reasoning as screenshots.yml —
# shared cPanel Node.js hosting cannot run Playwright/Chromium).
#
# Times are in UTC. Aligned with the daily-scan and screenshot schedules:
# 2x/day, 12:00 AM and 12:00 PM PKT.
on:
  schedule:
    - cron: '0 19 * * *'  # 00:00 PKT (midnight) — 19:00 UTC previous day
    - cron: '0 7 * * *'   # 12:00 PKT (noon)
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

jobs:
  otp-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # single-site check, much faster than the multi-site screenshot job
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium + OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run OTP delivery check
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OTP_TEST_EMAIL: ${{ secrets.OTP_TEST_EMAIL }}
          OTP_TEST_EMAIL_PASSWORD: ${{ secrets.OTP_TEST_EMAIL_PASSWORD }}
          OTP_IMAP_HOST: ${{ secrets.OTP_IMAP_HOST }}
          OTP_IMAP_PORT: ${{ secrets.OTP_IMAP_PORT }}
        run: node scripts/runOtpCheck.js
