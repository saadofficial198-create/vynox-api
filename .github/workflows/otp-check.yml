name: OTP email delivery check

# Verifies BoloCart's WooCommerce Email OTP Verification flow actually works
# end-to-end: plugin active (Layer 1) -> WP Mail SMTP configured (Layer 2) ->
# the plugin's own "send_otp" AJAX endpoint accepts a request and the email
# actually lands in the inbox (Layer 3, via a plain HTTP call + IMAP — no
# browser needed, see services/otpCheck.js for why). See also
# services/otpLayers.js, services/imapCheck.js, scripts/runOtpCheck.js.
#
# Times are in UTC. Aligned with the daily-scan and screenshot schedules:
# roughly 12:00 AM and 12:00 PM PKT.
#
# NOTE: deliberately NOT on the round hour (":00"). GitHub Actions doesn't
# guarantee scheduled runs fire at the exact minute — a huge number of repos
# schedule jobs at round hours like 00:00/12:00 UTC, so GitHub's shared
# runners get a burst of demand right then and queued jobs can be delayed by
# hours (observed live: a 07:00 UTC run hadn't started by 09:53 UTC — nearly
# 3 hours late). Offsetting to an odd minute (":13" here) avoids that crowd
# and keeps the actual delay much closer to GitHub's normal few-minutes lag.
on:
  schedule:
    - cron: '13 19 * * *'  # ~00:13 PKT — 19:13 UTC previous day
    - cron: '13 7 * * *'   # ~12:13 PKT
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

jobs:
  otp-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # just an HTTP call + a few IMAP polls now — no browser
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run OTP delivery check
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OTP_TEST_EMAIL: ${{ secrets.OTP_TEST_EMAIL }}
          OTP_TEST_EMAIL_PASSWORD: ${{ secrets.OTP_TEST_EMAIL_PASSWORD }}
          OTP_IMAP_HOST: ${{ secrets.OTP_IMAP_HOST }}
          OTP_IMAP_PORT: ${{ secrets.OTP_IMAP_PORT }}
          # Sent as the X-Vynox-Bot header on the send_otp AJAX call so a
          # site's Imunify360 (or similar) bot-protection can allowlist this
          # monitor by header instead of by IP (GitHub runner IPs change
          # every run, so IP whitelisting isn't viable). Optional — if unset,
          # the header is simply omitted.
          OTP_MONITOR_SECRET: ${{ secrets.OTP_MONITOR_SECRET }}
        run: node scripts/runOtpCheck.js
