name: Capture site screenshots

# Runs on GitHub's free Ubuntu runners (unlimited free minutes on public
# repos) instead of the cPanel backend, because shared cPanel Node.js
# hosting cannot run Playwright/Chromium. See scripts/runScreenshots.js and
# services/screenshot.js for the full explanation.
#
# Times are in UTC. Adjust to match when you want captures in your local
# time zone (Pakistan is UTC+5). Currently set to 2x/day, roughly aligned
# with the daily security scan: ~12:00 AM and ~12:00 PM PKT.
#
# NOTE: deliberately NOT on the round hour (":00"). GitHub Actions doesn't
# guarantee scheduled runs fire at the exact minute — round hours like
# 00:00/12:00 UTC get hit by a huge number of repos at once, so GitHub's
# shared runners can queue jobs for hours (observed live: a 07:00 UTC run
# still hadn't started ~3 hours later). Offsetting to an odd minute
# (":06" here, a couple minutes before otp-check/daily-scan so screenshots
# aren't all fighting for a runner at the exact same second) keeps the
# actual delay much closer to GitHub's normal few-minutes lag.
on:
  schedule:
    - cron: '6 19 * * *'  # ~00:06 PKT (midnight) — 19:06 UTC previous day
    - cron: '6 7 * * *'   # ~12:06 PKT (noon)
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

jobs:
  screenshots:
    runs-on: ubuntu-latest
    # 2026-07-29: bumped from 90 -> 180. Per-page capture now waits for REAL
    # load completion (images actually decoded, popups dismissed, no active
    # spinner) instead of a fixed 25s timeout — see services/screenshot.js
    # and the vynox-api README's Change Log entry for that date. Worst case
    # per page is now ~60s nav ceiling + ~45s settle ceiling ≈ 105-110s if a
    # page hits every ceiling (rare — most pages finish in a few seconds),
    # vs. the old fixed ~25s. 180 min keeps headroom at ~150 sites x
    # multiple pages each even if several sites are unusually slow.
    timeout-minutes: 180
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Note: npm caching (cache: 'npm') was removed — it kept failing
          # with "unable to cache dependencies" on this repo and was blocking
          # the whole job. It's just a speed optimization, not required for
          # correctness, so we run without it.

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium + OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run screenshot capture
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_BASE: ${{ secrets.FTP_REMOTE_BASE }}
          FTP_SECURE: ${{ secrets.FTP_SECURE }}
          SCREENSHOT_PUBLIC_BASE_URL: ${{ secrets.SCREENSHOT_PUBLIC_BASE_URL }}
          SCREENSHOT_DIFF_THRESHOLD_PCT: ${{ secrets.SCREENSHOT_DIFF_THRESHOLD_PCT }}
          SCREENSHOT_JPEG_QUALITY: ${{ secrets.SCREENSHOT_JPEG_QUALITY }}
        run: node scripts/runScreenshots.js
